<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fogbreak Design</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="fogbreak-fig" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-simd" data-weak-refs />
  <style>
    :root {
      --bg-canvas: #F7FAFC;
      --bg-panel: #FFFFFF;
      --text-primary: #111821;
      --text-muted: #526275;
      --accent: #087F9C;
      --border: #CBD5E1;
    }
    :root[data-theme="dark"] {
      --bg-canvas: #111821;
      --bg-panel: #1A2431;
      --text-primary: #F7FAFC;
      --text-muted: #94A3B8;
      --accent: #087F9C;
      --border: #2B394B;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }
    canvas#fogbreak_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      background: var(--bg-canvas);
    }
    #fogbreak_loading, #fogbreak_stopped {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      background: var(--bg-canvas);
      pointer-events: none;
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = params.get("theme");
      var dark = q === "dark" || (q !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <canvas id="fogbreak_canvas" data-host="page" data-engine="fogbreak-fig" data-rpc-key="fogbreakFigHost" data-iframe="false"></canvas>
  <div id="fogbreak_loading">Loading Fogbreak Design&hellip;</div>
</body>
</html>
