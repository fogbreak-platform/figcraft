[package]
name = "fogbreak-fig"
description = "Fogbreak Design in the browser (Tidal Strata white-label overlay wrapping the full design workbench on wasm32)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "fogbreak-fig"
path = "src/main.rs"

[dependencies]
figcraft-doc = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-text = { workspace = true }
base64 = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlAnchorElement",
    "Node",
    "Blob",
    "BlobPropertyBag",
    "ClipboardEvent",
    "DataTransfer",
    "File",
    "FileList",
    "HtmlInputElement",
    "EventTarget",
    "Url",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    "Storage",
    "Event",
    "CustomEvent",
    "CustomEventInit",
    "UrlSearchParams",
] }
